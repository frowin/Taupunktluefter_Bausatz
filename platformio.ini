; PlatformIO — Taupunktlüfter V7.0
; Arduino-ESP32 core 3.3.8 via pioarduino (official PlatformIO platform is stuck on 2.x)

[platformio]
src_dir = ESP32_Taupunktluefter_V7.0
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
extra_scripts = pre:scripts/load_dotenv.py

lib_deps =
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor
	fbiego/ESP32Time @ ^2.0.6
	mathertel/RotaryEncoder @ ^1.5.3
	gyverlibs/GyverOLED @ ^1.6.4
	esp32async/AsyncTCP
	esp32async/ESPAsyncWebServer @ 3.7.10

build_src_filter =
	+<*>
	-<tfa_3250_decode/tfa_3250_decode.ino>

build_flags =
	-DCORE_DEBUG_LEVEL=0
